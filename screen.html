<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARTMOS SCREEN · 행성 뽑기</title>
  <meta name="description" content="ARTMOS SCREEN — 큰 화면의 우주를 휴대폰으로 움직이는 인터랙티브 스크린" />
  <link rel="icon" href="assets/artmos-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/artmos-brand.css?v=1" />
  <link rel="stylesheet" href="css/screen.css?v=4" />
</head>
<body class="scr">
  <canvas id="sky"></canvas>

  <!-- 아무도 없을 때: 가운데 큰 안내 -->
  <section id="lobby" class="scr-lobby">
    <div class="scr-copy">
      <p class="scr-kick"><b class="logo">ARTMOS</b><span>SCREEN</span></p>
      <h1>행성 뽑기</h1>
      <p class="scr-lead">휴대폰 조이스틱으로 집게를 움직여<br>ARTMOS 전시 행성을 뽑아 보세요.</p>
      <ol class="scr-steps">
        <li><b>01</b><span>스캔</span><small>휴대폰 카메라로 QR을 비추거나<br>ARTMOS 앱 ‘스크린’ 탭에 숫자 입력</small></li>
        <li><b>02</b><span>뽑기</span><small>조이스틱으로 집게를 옮기고<br>‘잡기’를 눌러요 · 기회 3번</small></li>
        <li><b>03</b><span>관람하기</span><small>뽑은 행성은 내 휴대폰에 도착,<br>바로 그 전시로 들어가요</small></li>
      </ol>
    </div>
    <div class="scr-join">
      <div class="scr-qr" id="qr"></div>
      <p class="scr-code-l">입장 숫자</p>
      <p class="scr-code" id="code">····</p>
      <p class="scr-url" id="url"></p>
      <p class="scr-note">앱 설치 없이 바로 · 기계 3대 · 줄 서기</p>
    </div>
  </section>

  <!-- 누군가 들어왔을 때: 구석 작은 안내 + 아래 참여자 줄 -->
  <aside id="corner" class="scr-corner" hidden>
    <div class="scr-qr sm" id="qr2"></div>
    <div><p class="scr-code-l">함께하기</p><p class="scr-code sm" id="code2">····</p></div>
  </aside>
  <div id="players" class="scr-players"></div>
  <div id="toast" class="scr-toast" hidden></div>

  <div class="scr-tools">
    <span id="net" class="scr-net">연결 중</span>
    <button id="fs" type="button">전체 화면</button>
  </div>

  <script type="module" src="js/screen.js?v=5"></script>
</body>
</html>
